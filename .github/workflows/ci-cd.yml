name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-frontend:
    name: Build & Validate Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: healthcare-application/frontend/package.json

      - name: Install dependencies
        working-directory: healthcare-application/frontend
        run: npm ci || npm install

      - name: Compile TypeScript & Build Production Bundle
        working-directory: healthcare-application/frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: healthcare-application/frontend/dist

  validate-backend-ml:
    name: Test Backend & ML Inference Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: healthcare-application/backend/pyproject.toml

      - name: Install PyTorch CPU & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e "healthcare-application/backend[dev]"

      - name: Run ML Inference & API Test Suite
        env:
          PYTHONPATH: healthcare-application/backend
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest healthcare-application/backend/tests/test_ml_inference_integration.py -v

  docker-build-verification:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: [validate-frontend, validate-backend-ml]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: complete-medfed:latest

  deploy-huggingface:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: [docker-build-verification]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space (if HF_TOKEN configured)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        if: env.HF_TOKEN != '' && env.HF_SPACE_REPO != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add space "https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO"
          git push space main:main --force
